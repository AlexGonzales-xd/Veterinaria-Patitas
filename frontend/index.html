<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Veterinaria - Iniciar sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="card" style="max-width:360px;margin:80px auto;">
        <h2>🐾 Patitas</h2>
        <form id="login-form" style="display:grid;gap:12px;">
            <input id="email" type="email" placeholder="Email" required>
            <input id="password" type="password" placeholder="Contraseña" required>
            <p id="error" style="color:crimson;margin:0;display:none;"></p>
            <button id="btn-login" class="btn" type="submit">Entrar</button>
        </form>
    </main>

    <script type="module">
        import { login, getToken } from './js/auth.js';

        // Si ya hay sesión, ir directo al inicio
        if (getToken()) window.location.replace('home.html');

        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('error');
        const btn = document.getElementById('btn-login');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.textContent = 'Entrando...';
            try {
                await login(
                    document.getElementById('email').value.trim(),
                    document.getElementById('password').value
                );
                window.location.href = 'home.html';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>
